# =============================================================================
# Constrói as imagens próprias da stack e publica no Container Registry do GitLab.
# O Portainer CE não consegue fazer build por meio do agent ("frame too large"),
# então a stack só baixa estas imagens:
#   $CI_REGISTRY_IMAGE/zabbix-web   config/zabbix-web/ (nginx com o /catalogo/)
#   $CI_REGISTRY_IMAGE/grafana      config/grafana/ (plugin do Zabbix, datasource, LDAP)
#   $CI_REGISTRY_IMAGE/catalogo     catalogo/
# Tags: nome da branch (ex.: hml-corp), usada pela stack, e o commit curto.
#
# Depois do build, avisa as 3 stacks no Portainer, se a variável de CI
# PORTAINER_WEBHOOKS tiver os webhooks delas (separados por espaço).
# Para pegar builds novos do trunk, crie um agendamento semanal do pipeline.
# =============================================================================

stages: [build, deploy]

variables:
  ZABBIX_TAG: alpine-trunk
  GRAFANA_TAG: "13.2.4"
  DOCKER_TLS_CERTDIR: "/certs"

.build:
  stage: build
  image: docker:27
  services: ["docker:27-dind"]
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - IMG="$CI_REGISTRY_IMAGE/$NAME"
    - docker build --pull $BUILD_ARGS -t "$IMG:$CI_COMMIT_REF_SLUG" -t "$IMG:$CI_COMMIT_SHORT_SHA" "$CONTEXT"
    - docker push --all-tags "$IMG"

zabbix-web:
  extends: .build
  variables:
    NAME: zabbix-web
    CONTEXT: config/zabbix-web
    BUILD_ARGS: --build-arg ZABBIX_TAG=$ZABBIX_TAG

grafana:
  extends: .build
  variables:
    NAME: grafana
    CONTEXT: config/grafana
    BUILD_ARGS: --build-arg GRAFANA_TAG=$GRAFANA_TAG

catalogo:
  extends: .build
  variables:
    NAME: catalogo
    CONTEXT: catalogo
    BUILD_ARGS: ""

portainer:
  stage: deploy
  image:
    name: curlimages/curl:8.11.1
    entrypoint: [""]
  rules:
    - if: $PORTAINER_WEBHOOKS
  script:
    - for url in $PORTAINER_WEBHOOKS; do curl -fsS -X POST "$url" && echo "ok $url"; done
