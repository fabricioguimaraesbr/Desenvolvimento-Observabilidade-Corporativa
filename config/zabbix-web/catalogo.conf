# Catálogo de Monitoramento publicado em https://zabbix.empresa.com.br/catalogo/
# Incluído dentro do bloco "server" do container zabbix-web (ver nginx.conf / nginx_ssl.conf ao lado).

# /catalogo, /Catalogo e /catálogo (com acento) levam a /catalogo/
location = /catalogo {
    absolute_redirect off;
    return 301 /catalogo/$is_args$args;
}
location ~* "^/cat(a|á)logo(?:/(?<catalogo_rest>.*))?$" {
    # O nginx do Zabbix escuta em 8080/8443 dentro do container; o redirecionamento
    # relativo evita que essas portas apareçam na URL do navegador.
    absolute_redirect off;
    return 301 /catalogo/$catalogo_rest$is_args$args;
}

# "^~" faz este bloco ter prioridade sobre as regras de regex do Zabbix (.js, .css, .php...)
location ^~ /catalogo/ {
    # DNS interno do Docker. Com o destino numa variável, o zabbix-web sobe normalmente
    # mesmo com o catálogo parado: só /catalogo/ responde 502.
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $catalogo_upstream http://catalogo:8080;

    # O caminho vai completo (/catalogo/...); o catálogo usa BASE_PATH=/catalogo para entendê-lo.
    proxy_pass $catalogo_upstream;

    proxy_http_version 1.1;
    proxy_set_header Host               $host;
    proxy_set_header X-Real-IP          $remote_addr;
    proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto  $scheme;
    proxy_redirect   off;

    # Exportações grandes para Excel podem demorar
    proxy_read_timeout 300s;
    proxy_buffering    off;
}
