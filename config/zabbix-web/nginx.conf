# Cópia de /etc/zabbix/nginx.conf da imagem zabbix-web-nginx (7.0 e trunk/8.0, iguais) com o include do catálogo.
# Se a sua versão da imagem for diferente, compare com: docker exec <zabbix-web> cat /etc/zabbix/nginx.conf
server {
    listen 8080;
    include /etc/nginx/includes/listen-ipv6.conf;

    include /etc/nginx/includes/real-ip.conf;
    include /etc/nginx/catalogo/*.conf;
    include /etc/nginx/includes/server-common.conf;
}
