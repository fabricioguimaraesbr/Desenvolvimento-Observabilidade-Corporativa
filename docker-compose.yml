# =============================================================================
# Monitoramento Corporativo - stack de UM servidor
# -----------------------------------------------------------------------------
# A mesma stack roda nos 3 servidores. O Zabbix server fica em HA entre eles e
# o PostgreSQL e o ClickHouse já existentes ficam no servidor DBxxx.
#
#   Variáveis do servidor:    .env (copie de .env.example)
#   Variáveis dos containers: monitoring-data/<container>/<container>.env
#   Dados persistentes:       data/<container> (criada pelo scripts/preparar-servidor.sh)
#
#   Subir (nos 3 servidores):
#     docker compose up -d --build
#
# Detalhes no README.md.
# =============================================================================

name: monitoramento

x-logging: &default-logging
  logging:
    driver: json-file
    options:
      max-size: "20m"
      max-file: "5"

x-zabbix-sysctls: &zabbix-sysctls
  sysctls:
    - net.ipv4.ip_local_port_range=1024 64999
    - net.ipv4.conf.all.accept_redirects=0
    - net.ipv4.conf.all.secure_redirects=0
    - net.ipv4.conf.all.send_redirects=0

x-zabbix-ulimits: &zabbix-ulimits
  ulimits:
    nproc: 65535
    nofile:
      soft: 20000
      hard: 40000

# Pastas do Zabbix server
x-zabbix-server-volumes: &zabbix-server-volumes
  volumes:
    - /etc/localtime:/etc/localtime:ro
    - ./data/zabbix-server/alertscripts:/usr/lib/zabbix/alertscripts:ro
    - ./data/zabbix-server/externalscripts:/usr/lib/zabbix/externalscripts:ro
    - ./data/zabbix-server/export:/var/lib/zabbix/export:rw
    - ./data/zabbix-server/modules:/var/lib/zabbix/modules:ro
    - ./data/zabbix-server/enc:/var/lib/zabbix/enc:ro
    - ./data/zabbix-server/ssh_keys:/var/lib/zabbix/ssh_keys:ro
    - ./data/zabbix-server/mibs:/var/lib/zabbix/mibs:ro
    - ./data/zabbix-server/ssl/certs:/var/lib/zabbix/ssl/certs:ro
    - ./data/zabbix-server/ssl/keys:/var/lib/zabbix/ssl/keys:ro
    - ./data/zabbix-server/ssl/ssl_ca:/var/lib/zabbix/ssl/ssl_ca:ro

services:
  # ---------------------------------------------------------------------------
  # Zabbix server (HA: um nó por servidor; só um fica ativo por vez)
  # ---------------------------------------------------------------------------
  zabbix-server:
    image: zabbix/zabbix-server-pgsql:${ZABBIX_TAG:-alpine-trunk}
    container_name: zabbix-server
    init: true
    restart: unless-stopped
    env_file: ./monitoring-data/zabbix-server/zabbix-server.env
    environment:
      ZBX_HANODENAME: ${NODE_NAME:?Defina NODE_NAME no .env}
      ZBX_NODEADDRESS: ${NODE_IP:?Defina NODE_IP no .env}:${ZBX_SERVER_PORT:-10051}
      ZBX_JAVAGATEWAY: zabbix-java-gateway
      ZBX_WEBSERVICEURL: http://zabbix-web-service:10053/report
      ZBX_WEBDRIVERURL: http://selenium:4444
      TZ: ${TZ:-America/Sao_Paulo}
    ports:
      - "${BIND_IP:-0.0.0.0}:${ZBX_SERVER_PORT:-10051}:10051"
    <<: [*zabbix-server-volumes, *zabbix-sysctls, *zabbix-ulimits, *default-logging]
    tmpfs:
      - /tmp
      - /var/lib/zabbix/ssl/ssl_ca_internal:mode=770,uid=1997,gid=0
    stop_grace_period: 30s
    networks: [monitoring]

  # ---------------------------------------------------------------------------
  # Zabbix web (nginx). Sem ZBX_SERVER_HOST: em HA o frontend descobre o nó
  # ativo pelo banco. Também publica o Catálogo em /catalogo/.
  # ---------------------------------------------------------------------------
  zabbix-web:
    image: zabbix/zabbix-web-nginx-pgsql:${ZABBIX_TAG:-alpine-trunk}
    container_name: zabbix-web
    restart: unless-stopped
    env_file: ./monitoring-data/zabbix-web/zabbix-web.env
    environment:
      TZ: ${TZ:-America/Sao_Paulo}
    ports:
      - "${BIND_IP:-0.0.0.0}:${WEB_HTTP_PORT:-80}:8080"
      - "${BIND_IP:-0.0.0.0}:${WEB_HTTPS_PORT:-443}:8443"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      # Certificado do HTTPS (ssl.crt, ssl.key, dhparam.pem). Sem eles, só HTTP.
      - ./data/zabbix-web/ssl:/etc/ssl/nginx:ro
      - ./data/zabbix-web/modules:/usr/share/zabbix/modules:ro
      # /catalogo/ -> container catalogo (ver config/zabbix-web/)
      - ./config/zabbix-web/catalogo.conf:/etc/nginx/catalogo/catalogo.conf:ro
      - ./config/zabbix-web/nginx.conf:/etc/zabbix/nginx.conf:ro
      - ./config/zabbix-web/nginx_ssl.conf:/etc/zabbix/nginx_ssl.conf:ro
    tmpfs:
      - /tmp
      - /var/lib/php/session:mode=1777
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/ping"]
      interval: 1m
      timeout: 3s
      retries: 3
      start_period: 40s
    sysctls:
      - net.core.somaxconn=65535
    stop_grace_period: 10s
    <<: *default-logging
    networks: [monitoring]

  # ---------------------------------------------------------------------------
  # Zabbix proxy (um por servidor; os 3 formam um proxy group no frontend).
  # Também recebe APM (OpenTelemetry) e grava no ClickHouse.
  # ---------------------------------------------------------------------------
  zabbix-proxy:
    image: zabbix/zabbix-proxy-sqlite3:${ZABBIX_TAG:-alpine-trunk}
    container_name: zabbix-proxy
    init: true
    restart: unless-stopped
    env_file: ./monitoring-data/zabbix-proxy/zabbix-proxy.env
    environment:
      ZBX_HOSTNAME: proxy-${NODE_NAME:?Defina NODE_NAME no .env}
      ZBX_SERVER_HOST: ${ZBX_HA_NODES:?Defina ZBX_HA_NODES no .env}
      ZBX_JAVAGATEWAY: zabbix-java-gateway
      ZBX_WEBDRIVERURL: http://selenium:4444
      TZ: ${TZ:-America/Sao_Paulo}
    ports:
      - "${BIND_IP:-0.0.0.0}:${ZBX_PROXY_PORT:-10061}:10051"
      - "${BIND_IP:-0.0.0.0}:${ZBX_PROXY_APM_PORT:-4317}:4317"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./data/zabbix-proxy/db_data:/var/lib/zabbix/db_data:rw
      - ./data/zabbix-proxy/externalscripts:/usr/lib/zabbix/externalscripts:ro
      - ./data/zabbix-proxy/modules:/var/lib/zabbix/modules:ro
      - ./data/zabbix-proxy/enc:/var/lib/zabbix/enc:ro
      - ./data/zabbix-proxy/ssh_keys:/var/lib/zabbix/ssh_keys:ro
      - ./data/zabbix-proxy/mibs:/var/lib/zabbix/mibs:ro
      - ./data/zabbix-proxy/ssl/certs:/var/lib/zabbix/ssl/certs:ro
      - ./data/zabbix-proxy/ssl/keys:/var/lib/zabbix/ssl/keys:ro
      - ./data/zabbix-proxy/ssl/ssl_ca:/var/lib/zabbix/ssl/ssl_ca:ro
    tmpfs:
      - /tmp
      - /var/lib/zabbix/ssl/ssl_ca_internal:mode=770,uid=1997,gid=0
    stop_grace_period: 30s
    <<: [*zabbix-sysctls, *zabbix-ulimits, *default-logging]
    networks: [monitoring]

  # ---------------------------------------------------------------------------
  # Zabbix Java gateway (JMX) - só rede interna
  # ---------------------------------------------------------------------------
  zabbix-java-gateway:
    image: zabbix/zabbix-java-gateway:${ZABBIX_TAG:-alpine-trunk}
    container_name: zabbix-java-gateway
    restart: unless-stopped
    read_only: true
    env_file: ./monitoring-data/zabbix-java-gateway/zabbix-java-gateway.env
    environment:
      TZ: ${TZ:-America/Sao_Paulo}
    tmpfs: [/tmp]
    stop_grace_period: 5s
    <<: *default-logging
    networks: [monitoring]

  # ---------------------------------------------------------------------------
  # Zabbix web service (relatórios agendados em PDF) - só rede interna
  # ---------------------------------------------------------------------------
  zabbix-web-service:
    image: zabbix/zabbix-web-service:${ZABBIX_TAG:-alpine-trunk}
    container_name: zabbix-web-service
    restart: unless-stopped
    read_only: true
    env_file: ./monitoring-data/zabbix-web-service/zabbix-web-service.env
    environment:
      TZ: ${TZ:-America/Sao_Paulo}
    tmpfs:
      - /tmp
      - /var/lib/zabbix/enc_internal
    # Perfil seccomp do Chrome usado pela imagem oficial para gerar os PDFs
    security_opt:
      - seccomp:./config/zabbix-web-service/chrome_dp.json
    stop_grace_period: 5s
    <<: *default-logging
    networks: [monitoring]

  # ---------------------------------------------------------------------------
  # Zabbix MCP server (acesso de agentes de IA à API do Zabbix)
  # ---------------------------------------------------------------------------
  zabbix-mcp-server:
    image: zabbix/zabbix-mcp-server:${ZABBIX_TAG:-alpine-trunk}
    container_name: zabbix-mcp-server
    restart: unless-stopped
    read_only: true
    env_file: ./monitoring-data/zabbix-mcp-server/zabbix-mcp-server.env
    environment:
      TZ: ${TZ:-America/Sao_Paulo}
    ports:
      - "${BIND_IP:-0.0.0.0}:${MCP_PORT:-8444}:8443"
    tmpfs:
      - /tmp
      - /var/lib/zabbix/enc_internal:mode=0700,uid=1997,gid=0
    depends_on: [zabbix-web]
    stop_grace_period: 5s
    <<: *default-logging
    networks: [monitoring]

  # ---------------------------------------------------------------------------
  # Selenium (Chrome) para os itens de browser / web monitoring do Zabbix
  # ---------------------------------------------------------------------------
  selenium:
    image: selenium/standalone-chrome:${SELENIUM_TAG:-latest}
    container_name: selenium
    restart: unless-stopped
    env_file: ./monitoring-data/selenium/selenium.env
    environment:
      TZ: ${TZ:-America/Sao_Paulo}
    shm_size: 2gb
    stop_grace_period: 30s
    <<: *default-logging
    networks: [monitoring]

  # ---------------------------------------------------------------------------
  # Grafana (banco compartilhado no PostgreSQL do DBxxx; os 3 servidores
  # mostram os mesmos dashboards atrás do F5)
  # ---------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:${GRAFANA_TAG:-13.2.4}
    container_name: grafana
    restart: unless-stopped
    user: "472:0"
    env_file: ./monitoring-data/grafana/grafana.env
    environment:
      GF_UNIFIED_ALERTING_HA_PEERS: ${GRAFANA_HA_PEERS:-}
      GF_UNIFIED_ALERTING_HA_ADVERTISE_ADDRESS: ${NODE_IP:?Defina NODE_IP no .env}:${GRAFANA_HA_PORT:-9094}
      GF_UNIFIED_ALERTING_HA_LISTEN_ADDRESS: 0.0.0.0:9094
      TZ: ${TZ:-America/Sao_Paulo}
    ports:
      - "${BIND_IP:-0.0.0.0}:${GRAFANA_PORT:-3000}:3000"
      - "${BIND_IP:-0.0.0.0}:${GRAFANA_HA_PORT:-9094}:9094/tcp"
      - "${BIND_IP:-0.0.0.0}:${GRAFANA_HA_PORT:-9094}:9094/udp"
    volumes:
      - ./data/grafana:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
    <<: *default-logging
    networks: [monitoring]

  # ---------------------------------------------------------------------------
  # Portainer agent (gerenciado pelo Portainer server corporativo)
  # ---------------------------------------------------------------------------
  portainer-agent:
    image: portainer/agent:${PORTAINER_AGENT_TAG:-latest}
    container_name: portainer-agent
    restart: unless-stopped
    env_file: ./monitoring-data/portainer-agent/portainer-agent.env
    ports:
      - "${BIND_IP:-0.0.0.0}:${PORTAINER_AGENT_PORT:-9001}:9001"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/volumes:/var/lib/docker/volumes
      - /:/host
    <<: *default-logging
    networks: [monitoring]

  # ---------------------------------------------------------------------------
  # Catálogo de Monitoramento (publicado em /catalogo/ pelo zabbix-web)
  # ---------------------------------------------------------------------------
  catalogo:
    build: ./catalogo
    image: catalogo-monitoramento:latest
    container_name: catalogo
    restart: unless-stopped
    env_file: ./monitoring-data/catalogo/catalogo.env
    environment:
      BASE_PATH: /catalogo
      COLLECT_AT: ${CATALOGO_COLLECT_AT:-03:30}
      TZ: ${TZ:-America/Sao_Paulo}
    ports:
      - "${BIND_IP:-0.0.0.0}:${CATALOGO_PORT:-8088}:8080"
    volumes:
      - ./data/catalogo:/data
      - ./monitoring-data/catalogo/rules.yaml:/config/rules.yaml:ro
    deploy:
      resources:
        limits:
          memory: 1g
    <<: *default-logging
    networks: [monitoring]

networks:
  monitoring:
    name: monitoring
    driver: bridge
