# Trecho para acrescentar ao serviço web do Zabbix (zabbix-web-nginx-pgsql) no compose do Zabbix.
# Não é um compose completo: copie só os "volumes" para o serviço que já existe.
# Os caminhos assumem que este repositório está em /opt/catalogo-monitoramento; ajuste se for outro.
services:
  zabbix-web-nginx-pgsql:
    volumes:
      - /opt/catalogo-monitoramento/deploy/zabbix-web/catalogo.conf:/etc/nginx/catalogo/catalogo.conf:ro
      - /opt/catalogo-monitoramento/deploy/zabbix-web/nginx.conf:/etc/zabbix/nginx.conf:ro
      # Só se o HTTPS for feito pelo próprio container (certificados em /etc/ssl/nginx):
      - /opt/catalogo-monitoramento/deploy/zabbix-web/nginx_ssl.conf:/etc/zabbix/nginx_ssl.conf:ro
