# Cópia de /etc/zabbix/nginx_ssl.conf da imagem zabbix-web-nginx (7.0) com o include do catálogo.
# Se a sua versão da imagem for diferente, compare com: docker exec <zabbix-web> cat /etc/zabbix/nginx_ssl.conf
server {
    listen 8443 ssl;
    include /etc/nginx/includes/listen-ipv6-ssl.conf;

    http2 on;

    include /etc/nginx/includes/real-ip.conf;
    include /etc/nginx/includes/server-ssl.conf;
    include /etc/nginx/catalogo/*.conf;
    include /etc/nginx/includes/server-common.conf;
}
