<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Catálogo de Monitoramento</title>
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23C8102E'/%3E%3Cpath d='M8 20h4v4H8zM14 14h4v10h-4zM20 8h4v16h-4z' fill='white'/%3E%3C/svg%3E">
  <meta name="theme-color" content="#F6F1F2" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121014" media="(prefers-color-scheme: dark)">
  <link rel="stylesheet" href="static/app.css?v=3">
</head>
<body>
  <a class="skip" href="#main">Pular para o conteúdo</a>
  <header class="topbar">
    <div class="wrap topbar__inner">
      <a class="brand" href="#/" aria-label="Início">
        <span class="brand__mark" aria-hidden="true"></span>
        <span class="brand__name" data-title>Catálogo de Monitoramento</span>
      </a>
      <nav class="nav" aria-label="Principal">
        <a href="#/">Aplicações</a>
        <a href="#/sem-aplicacao">Hosts sem aplicação</a>
        <a href="#/sobre">Como funciona</a>
      </nav>
      <form class="topsearch" role="search" data-search-form>
        <label class="sr" for="topq">Buscar</label>
        <input id="topq" name="q" type="search" placeholder="Buscar host, IP, item…" autocomplete="off">
      </form>
    </div>
  </header>
  <main id="main" tabindex="-1"></main>
  <footer class="foot">
    <div class="wrap foot__inner">
      <span data-collected>Carregando…</span>
      <span>Dados de configuração do Zabbix. Nada aqui é alterado no Zabbix.</span>
    </div>
  </footer>
  <script src="static/app.js?v=3" defer></script>
</body>
</html>
