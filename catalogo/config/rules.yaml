# Regras do Catálogo de Monitoramento
# Edite este arquivo e reinicie o container (ou aguarde a próxima coleta).

# 1) Cada host group vira uma aplicação automaticamente
auto_applications:
  enabled: true
  include:
    - "^APP/"                 # só grupos que começam com APP/  (ajuste ao padrão de vocês)
  exclude:
    - "^Templates"
    - "^Discovered hosts$"
    - "^Zabbix servers$"
  # Converte o nome do grupo no nome da aplicação. O grupo nomeado "app" é usado.
  # Ex.: "APP/Checkout/Frontend" -> "Checkout"
  name_pattern: "^APP/(?P<app>[^/]+)"

# 2) Regras extras e metadados por aplicação.
#    Se o nome for igual ao de uma aplicação automática, as duas se juntam.
applications:
  - name: "Checkout"
    owner: "Squad Checkout"
    description: "Fluxo de finalização de compra do site e do app."
    match:
      # Hosts compartilhados (ex.: banco) entram só com os itens que citam a aplicação
      item_keys: ['\[checkout\]']           # regex PostgreSQL, sem diferenciar maiúsculas
      triggers: ['(?i)checkout']            # regex Python sobre o nome da trigger

  - name: "Pagamentos"
    owner: "Squad Pagamentos"
    match:
      item_keys: ['\[pagamentos']
      host_macros:
        "{$APP.NAME}": "(?i)pagamentos"

  # Aplicação que não tem host group próprio: montada só por regras
  - name: "Certificados digitais"
    owner: "Observabilidade"
    description: "Validade de certificados TLS dos sites públicos."
    match:
      templates: ["(?i)certificate"]

# 3) Aplicações que não devem aparecer no catálogo (regex sobre o nome)
hidden_applications: []
